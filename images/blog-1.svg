<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bGrad_blog-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect width="650" height="340" rx="16" fill="url(#bGrad_blog-1)" />
  
  <!-- Subtle overlay shapes -->
  <circle cx="560" cy="80" r="140" fill="#ffffff" opacity="0.06" />
  <circle cx="80" cy="280" r="110" fill="#ffffff" opacity="0.06" />
  
  <!-- Code/Article UI card -->
  <g transform="translate(60, 45)">
    <rect width="530" height="250" rx="12" fill="#0f172a" opacity="0.95" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
    <circle cx="25" cy="25" r="5" fill="#ef4444" />
    <circle cx="40" cy="25" r="5" fill="#eab308" />
    <circle cx="55" cy="25" r="5" fill="#10b981" />
    <line x1="0" y1="45" x2="530" y2="45" stroke="#334155" stroke-width="1" />
    
    <text x="35" y="85" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">HTML5 Semantic Architecture</text>
    <text x="35" y="115" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Why Structure, Tags, and Accessibility Matter</text>
    
    <!-- Visual code blocks -->
    <g transform="translate(35, 145)">
      <rect x="0" y="0" width="220" height="70" rx="8" fill="#1e293b" />
      <text x="15" y="25" font-family="monospace" font-size="12" fill="#38bdf8">&lt;header role="banner"&gt;</text>
      <text x="30" y="45" font-family="monospace" font-size="12" fill="#a78bfa">&lt;nav class="navbar"&gt;</text>
      
      <rect x="240" y="0" width="220" height="70" rx="8" fill="#1e293b" />
      <text x="15" y="25" font-family="monospace" font-size="12" fill="#34d399">display: grid;</text>
      <text x="15" y="45" font-family="monospace" font-size="12" fill="#f43f5e">grid-template-columns: 1fr;</text>
    </g>
