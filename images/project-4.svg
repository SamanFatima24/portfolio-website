<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad_project-" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="pShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="600" height="380" rx="16" fill="#0f172a" />
  
  <!-- Browser Chrome -->
  <rect x="0" y="0" width="600" height="40" rx="16" fill="#1e293b" />
  <rect x="0" y="25" width="600" height="15" fill="#1e293b" />
  <circle cx="25" cy="20" r="5" fill="#ef4444" />
  <circle cx="42" cy="20" r="5" fill="#eab308" />
  <circle cx="59" cy="20" r="5" fill="#10b981" />
  <rect x="90" y="10" width="300" height="20" rx="6" fill="#0f172a" />
  <text x="110" y="24" font-family="monospace" font-size="11" fill="#94a3b8">https://samanfatima.dev/projects/project-4</text>
  
  <!-- Canvas Content -->
  <g transform="translate(30, 65)">
    <!-- Header banner -->
    <rect width="540" height="90" rx="12" fill="url(#pGrad_project-)" filter="url(#pShadow)" />
    <text x="24" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Culinary Craft App</text>
    <text x="24" y="66" font-family="system-ui, sans-serif" font-size="14" fill="#f8fafc" opacity="0.9">Recipe Directory & Meal Planner</text>
    
    <!-- Content Cards -->
    <g transform="translate(0, 110)">
      <!-- Left Main Card -->
      <rect x="0" y="0" width="340" height="175" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <rect x="20" y="20" width="120" height="12" rx="4" fill="#f59e0b" />
      <rect x="20" y="44" width="260" height="8" rx="3" fill="#475569" />
      <rect x="20" y="60" width="220" height="8" rx="3" fill="#475569" />
      <rect x="20" y="76" width="290" height="8" rx="3" fill="#475569" />
      
      <!-- Metrics row -->
      <g transform="translate(20, 105)">
        <rect x="0" y="0" width="90" height="50" rx="6" fill="#0f172a" />
        <rect x="100" y="0" width="90" height="50" rx="6" fill="#0f172a" />
        <rect x="200" y="0" width="90" height="50" rx="6" fill="#0f172a" />
        <text x="15" y="24" font-family="system-ui" font-size="11" fill="#94a3b8">Status</text>
        <text x="15" y="42" font-family="system-ui" font-weight="bold" font-size="13" fill="#38bdf8">Active</text>
        <text x="115" y="24" font-family="system-ui" font-size="11" fill="#94a3b8">Score</text>
        <text x="115" y="42" font-family="system-ui" font-weight="bold" font-size="13" fill="#10b981">98.4%</text>
        <text x="215" y="24" font-family="system-ui" font-size="11" fill="#94a3b8">Stack</text>
        <text x="215" y="42" font-family="system-ui" font-weight="bold" font-size="13" fill="#f59e0b">HTML/CSS</text>
      </g>

      <!-- Right Side Card -->
      <g transform="translate(360, 0)">
        <rect x="0" y="0" width="180" height="175" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <circle cx="90" cy="55" r="35" fill="none" stroke="#334155" stroke-width="8" />
        <circle cx="90" cy="55" r="35" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="160 220" />
        <text x="90" y="60" text-anchor="middle" font-family="system-ui" font-weight="bold" font-size="15" fill="#ffffff">82%</text>
        <rect x="25" y="110" width="130" height="8" rx="4" fill="#475569" />
        <rect x="40" y="126" width="100" height="8" rx="4" fill="#334155" />
        <rect x="25" y="145" width="130" height="16" rx="4" fill="#f59e0b" opacity="0.3" />
      </g>
    </g>
  </g>
</svg>