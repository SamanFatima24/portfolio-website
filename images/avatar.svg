<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbd2ac" />
      <stop offset="100%" stop-color="#e2b184" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="160" fill="#ffffff" opacity="0.06" />
  <circle cx="200" cy="200" r="130" fill="#ffffff" opacity="0.08" />
  
  <!-- Floating decorative elements -->
  <g fill="#38bdf8" opacity="0.85">
    <text x="35" y="85" font-family="monospace" font-size="18" font-weight="bold">&lt;SE /&gt;</text>
    <text x="305" y="85" font-family="monospace" font-size="18" font-weight="bold">[QA &#10003;]</text>
    <text x="35" y="335" font-family="monospace" font-size="18" font-weight="bold">&lt;UI/UX&gt;</text>
    <text x="290" y="335" font-family="monospace" font-size="18" font-weight="bold">&lt;/code&gt;</text>
    <circle cx="340" cy="190" r="6" fill="#a78bfa" />
    <circle cx="60" cy="210" r="8" fill="#38bdf8" />
    <rect x="315" y="230" width="14" height="14" rx="3" fill="#ec4899" transform="rotate(25 322 237)" />
  </g>

  <!-- Developer / QA Student Illustration -->
  <g filter="url(#shadow)">
    <!-- Long Hair Back -->
    <path d="M135 180 C130 260, 140 330, 160 360 C165 365, 175 350, 170 300 C165 250, 160 210, 160 180 Z" fill="#18181b" />
    <path d="M265 180 C270 260, 260 330, 240 360 C235 365, 225 350, 230 300 C235 250, 240 210, 240 180 Z" fill="#18181b" />

    <!-- Shoulders / Coat -->
    <path d="M110 380 C110 295, 145 270, 200 270 C255 270, 290 295, 290 380 Z" fill="url(#shirtGrad)" />
    <!-- Inner top -->
    <polygon points="175,270 225,270 200,315" fill="#38bdf8" />
    <polygon points="185,270 215,270 200,295" fill="#ffffff" />
    
    <!-- Neck -->
    <rect x="184" y="220" width="32" height="60" rx="8" fill="url(#skinGrad)" />
    
    <!-- Head -->
    <ellipse cx="200" cy="180" rx="56" ry="68" fill="url(#skinGrad)" />
    
    <!-- Hair Front / Style -->
    <path d="M140 175 C138 115, 165 100, 200 100 C235 100, 262 115, 260 175 C250 145, 235 130, 200 130 C165 130, 150 145, 140 175 Z" fill="#18181b" />
    
    <!-- Glasses -->
    <rect x="156" y="166" width="36" height="24" rx="6" fill="none" stroke="#0f172a" stroke-width="3.5" />
    <rect x="208" y="166" width="36" height="24" rx="6" fill="none" stroke="#0f172a" stroke-width="3.5" />
    <line x1="192" y1="178" x2="208" y2="178" stroke="#0f172a" stroke-width="3.5" />
    <line x1="145" y1="174" x2="156" y2="176" stroke="#0f172a" stroke-width="2.5" />
    <line x1="244" y1="176" x2="255" y2="174" stroke="#0f172a" stroke-width="2.5" />
    
    <!-- Eyes -->
    <circle cx="174" cy="178" r="3.5" fill="#0f172a" />
    <circle cx="226" cy="178" r="3.5" fill="#0f172a" />
    
    <!-- Smile -->
    <path d="M188 214 Q200 224 212 214" fill="none" stroke="#993b2a" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>