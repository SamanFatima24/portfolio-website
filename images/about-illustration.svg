<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="20" fill="url(#deskGrad)" />
  
  <!-- Desk line -->
  <line x1="40" y1="280" x2="460" y2="280" stroke="#4338ca" stroke-width="4" stroke-linecap="round" />
  
  <!-- Laptop -->
  <g transform="translate(130, 110)">
    <!-- Screen frame -->
    <rect x="0" y="0" width="240" height="150" rx="8" fill="#e2e8f0" stroke="#0f172a" stroke-width="3" />
    <rect x="8" y="8" width="224" height="134" rx="4" fill="url(#screenGrad)" />
    <!-- Code on screen -->
    <circle cx="20" cy="20" r="3" fill="#ef4444" />
    <circle cx="28" cy="20" r="3" fill="#eab308" />
    <circle cx="36" cy="20" r="3" fill="#10b981" />
    <rect x="20" y="35" width="80" height="6" rx="3" fill="#818cf8" />
    <rect x="35" y="48" width="120" height="6" rx="3" fill="#38bdf8" />
    <rect x="50" y="61" width="90" height="6" rx="3" fill="#f43f5e" />
    <rect x="35" y="74" width="140" height="6" rx="3" fill="#34d399" />
    <rect x="20" y="87" width="60" height="6" rx="3" fill="#818cf8" />
    <rect x="35" y="100" width="100" height="6" rx="3" fill="#a78bfa" />
    <!-- Base -->
    <polygon points="-20,150 260,150 240,165 0,165" fill="#cbd5e1" stroke="#0f172a" stroke-width="2" />
    <rect x="95" y="152" width="50" height="4" rx="2" fill="#94a3b8" />
  </g>
  
  <!-- Coffee Cup -->
  <g transform="translate(400, 230)">
    <rect x="0" y="10" width="28" height="38" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
    <path d="M28 18 C38 18, 38 32, 28 32" fill="none" stroke="#64748b" stroke-width="3" />
    <path d="M8 4 Q12 0 8 -6" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M18 4 Q22 0 18 -6" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>
  
  <!-- Plant -->
  <g transform="translate(60, 215)">
    <polygon points="10,35 30,35 26,65 14,65" fill="#fb923c" />
    <ellipse cx="20" cy="30" rx="14" ry="18" fill="#10b981" />
    <ellipse cx="12" cy="22" rx="10" ry="14" fill="#059669" />
    <ellipse cx="28" cy="22" rx="10" ry="14" fill="#34d399" />
  </g>
  
  <!-- Floating Badges -->
  <g transform="translate(60, 50)">
    <rect width="90" height="32" rx="8" fill="#4f46e5" opacity="0.9" />
    <text x="12" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">HTML5 / CSS3</text>
  </g>
  <g transform="translate(340, 50)">
    <rect width="100" height="32" rx="8" fill="#0ea5e9" opacity="0.9" />
    <text x="12" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Responsive UI</text>
  </g>
</svg>